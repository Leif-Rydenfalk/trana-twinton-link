name: heartbeat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - heartbeat.py
      - .github/workflows/heartbeat.yml

permissions:
  contents: write

concurrency:
  group: trana-twinton-heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check both ends and write bridge.json
        run: python3 heartbeat.py

      - name: Commit the bridge
        run: |
          git config user.name "trana-relay-heartbeat"
          git config user.email "actions@users.noreply.github.com"
          git add bridge.json
          if git diff --cached --quiet; then
            echo "bridge unchanged"
          else
            git commit -m "heartbeat $(date -u +%FT%TZ)"
          fi
          # another lane (the Pages build, an API upload, or a person) may have pushed: replay on top
          git pull --rebase origin main
          git push

      - name: Fail when the link is not live
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("bridge.json"))
          s = d["link"]["state"]
          print("state:", s, "| errors:", d["link"].get("errors"))
          sys.exit(0 if s == "live" else 1)
          PY
